name: release

# Push a tag like v1.0.0: every target is built, packed and attached to a
# GitHub release for that tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: pack (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "hc-tui-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/hc-tui.exe, README.md, LICENSE, NOTICE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - name: pack (unix)
        if: runner.os != 'Windows'
        run: |
          name="hc-tui-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/hc-tui README.md LICENSE NOTICE "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            hc-tui-*.zip
            hc-tui-*.tar.gz
            hc-tui-*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: notes
        run: |
          # The section of CHANGELOG.md for this version, if there is one.
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## " v {p=1; next} /^## / {p=0} p' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "hc-tui ${GITHUB_REF_NAME}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
