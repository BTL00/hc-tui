[package]
name = "hc-tui"
version = "1.0.2"
edition = "2024"
description = "Terminal UI for herdr-core: many coding agents in one terminal, see who is waiting for you, copy Claude's code exactly"
license = "Apache-2.0"
repository = "https://github.com/BTL00/hc-tui"
readme = "README.md"
keywords = ["herdr", "terminal", "tui", "agents", "multiplexer"]
categories = ["command-line-utilities"]
exclude = ["packaging/", "docs/", ".github/"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
ratatui = "0.30.2"
serde_json = "1.0.154"
unicode-width = "0.2.3"
vt100 = "0.18.1"

[target."cfg(windows)".dependencies]
png = "0.18.1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse"] }
